device:
  name_contains: "Focusrite USB Audio"

input_device:
  name_contains: "Focusrite USB Audio"
  host_api_contains: "DirectSound"
  minimum_input_channels: 2

output_device:
  name_contains: "Focusrite USB Audio"
  host_api_contains: "DirectSound"
  minimum_output_channels: 2

stream:
  sample_rate: 48000
  input_channels: 2
  output_channels: 2
  block_size: 128
  dtype: float32

execution:
  timeout_seconds: 5.0

loopback:
  output_channel: 0
  input_channel: 0
  signal_duration_seconds: 1.0
  frequency_hz: 1000.0
  amplitude: 0.25
  frequency_tolerance_hz: 5.0
  padding_seconds: 0.1