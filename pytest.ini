[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=audio_hw_framework
    --cov-report=term-missing
markers =
    unit: software-only unit tests
    integration: tests involving multiple framework components
    hardware: tests requiring physical audio hardware