[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "audio-hardware-automation-framework"
version = "0.3.0"
description = "Framework for automated audio hardware testing and validation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "sounddevice>=0.5,<1.0",
    "soundfile>=0.14,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13,<15",
]


[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.15.21",
    "types-PyYAML",
]


[project.scripts]
audio-hw = "audio_hw_framework.cli:app"


[tool.hatch.build.targets.wheel]
packages = ["src/audio_hw_framework"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=audio_hw_framework",
    "--cov-report=term-missing",
]

markers = [
    "unit: deterministic unit tests",
    "integration: integration tests",
    "hardware: tests requiring physical audio hardware",
]

[tool.ruff]
required-version = "==0.15.21"
target-version = "py313"
line-length = 100
src = ["src", "tests"]


[tool.ruff.format]
preview = true


[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]


[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["audio_hw_framework.cli"]
disable_error_code = ["misc"]