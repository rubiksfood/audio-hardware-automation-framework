[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "audio-hardware-automation-framework"
version = "0.1.0"
description = "Framework for automated audio hardware testing and validation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []


[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]


[tool.hatch.build.targets.wheel]
packages = ["src/audio_hw_framework"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

markers = [
    "unit: deterministic unit tests",
    "integration: integration tests",
    "hardware: tests requiring physical audio hardware",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]


[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]